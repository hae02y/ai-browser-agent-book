<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="255" viewBox="0 0 1120 255" role="img" aria-labelledby="t d"><title id="t">데스크톱 화면 작업의 확인 경계</title><desc id="d">현재 앱과 파일을 관찰하고 모델의 행동 요청을 실행기 조작과 구분한다. 파일 변경 전 사람의 승인을 받은 뒤 새 파일을 다시 열어 결과를 확인한다.</desc><rect width="1120" height="255" rx="20" fill="#f8fafc"/><text x="40" y="51" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#172033">데스크톱 화면 작업의 확인 경계</text><rect x="40" y="86" width="220" height="122" rx="16" fill="#e8f3ff" stroke="#b6c7d7"/><text x="56" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">현재 화면 관찰</text><text x="56" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">앱·파일명 확인</text><text x="270" y="157" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="315" y="86" width="220" height="122" rx="16" fill="#e8f7ef" stroke="#b6c7d7"/><text x="331" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">행동 요청·실행</text><text x="331" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">모델과 실행기 구분</text><text x="545" y="157" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="590" y="86" width="220" height="122" rx="16" fill="#fff2de" stroke="#b6c7d7"/><text x="606" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">파일 변경 전 승인</text><text x="606" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">대상·저장 위치 확인</text><text x="820" y="157" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="865" y="86" width="220" height="122" rx="16" fill="#f2ebff" stroke="#b6c7d7"/><text x="881" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">결과 다시 확인</text><text x="881" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">새 파일 열어 대조</text></svg>
