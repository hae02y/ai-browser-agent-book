<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="255" viewBox="0 0 1120 255" role="img" aria-labelledby="t d"><title id="t">하네스가 지키는 네 경계</title><desc id="d">볼 수 있는 화면 → 할 수 있는 행동 → 사람의 승인 → 남기는 증거</desc><rect width="1120" height="255" rx="20" fill="#f8fafc"/><text x="45" y="52" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#172033">하네스가 지키는 네 경계</text><rect x="45" y="87" width="236" height="115" rx="16" fill="#e8f3ff" stroke="#b6c7d7"/><text x="63" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">볼 수 있는 화면</text><text x="286" y="149" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="310" y="87" width="236" height="115" rx="16" fill="#e8f7ef" stroke="#b6c7d7"/><text x="328" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">할 수 있는 행동</text><text x="551" y="149" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="574" y="87" width="236" height="115" rx="16" fill="#fff2de" stroke="#b6c7d7"/><text x="592" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">사람의 승인</text><text x="816" y="149" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="838" y="87" width="236" height="115" rx="16" fill="#f3ebff" stroke="#b6c7d7"/><text x="856" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">남기는 증거</text></svg>
