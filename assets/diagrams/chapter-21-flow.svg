<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="255" viewBox="0 0 1120 255" role="img" aria-labelledby="t d"><title id="t">새 도구를 보는 다섯 질문</title><desc id="d">읽는 범위, 변경 권한, 승인 시점, 실패와 복구, 데이터와 세션 보관을 확인한다.</desc><rect width="1120" height="255" rx="20" fill="#f8fafc"/><text x="35" y="49" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#172033">새 도구를 보는 다섯 질문</text><rect x="34" y="84" width="172" height="120" rx="16" fill="#e8f3ff" stroke="#b6c7d7"/><text x="48" y="147" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">읽는 범위</text><text x="216" y="152" font-family="sans-serif" font-size="25" fill="#52677d">→</text><rect x="252" y="84" width="172" height="120" rx="16" fill="#e8f7ef" stroke="#b6c7d7"/><text x="266" y="147" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">변경 권한</text><text x="434" y="152" font-family="sans-serif" font-size="25" fill="#52677d">→</text><rect x="470" y="84" width="172" height="120" rx="16" fill="#fff2de" stroke="#b6c7d7"/><text x="484" y="147" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">승인 시점</text><text x="652" y="152" font-family="sans-serif" font-size="25" fill="#52677d">→</text><rect x="688" y="84" width="172" height="120" rx="16" fill="#f2ebff" stroke="#b6c7d7"/><text x="702" y="147" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">실패·복구</text><text x="870" y="152" font-family="sans-serif" font-size="25" fill="#52677d">→</text><rect x="906" y="84" width="172" height="120" rx="16" fill="#ffeaf0" stroke="#b6c7d7"/><text x="920" y="147" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">데이터·세션</text></svg>
