<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="255" viewBox="0 0 1120 255" role="img" aria-labelledby="t d"><title id="t">모바일 앱 작업의 확인 경계</title><desc id="d">앱과 계정을 확인한 뒤 현재 화면을 보고 터치한다. 일정 저장이나 초대 전에는 사람의 승인을 받고, 완료 후 목록과 상세 화면에서 실제 상태를 다시 확인한다.</desc><rect width="1120" height="255" rx="20" fill="#f8fafc"/><text x="40" y="51" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#172033">모바일 앱 작업의 확인 경계</text><rect x="40" y="86" width="220" height="122" rx="16" fill="#e8f3ff" stroke="#b6c7d7"/><text x="56" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">앱·계정 확인</text><text x="56" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">개인·공유 범위 구분</text><text x="270" y="157" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="315" y="86" width="220" height="122" rx="16" fill="#e8f7ef" stroke="#b6c7d7"/><text x="331" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">화면 관찰·터치</text><text x="331" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">화면 변화 뒤 재관찰</text><text x="545" y="157" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="590" y="86" width="220" height="122" rx="16" fill="#fff2de" stroke="#b6c7d7"/><text x="606" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">저장·초대 전 승인</text><text x="606" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">계정·대상·권한 확인</text><text x="820" y="157" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="865" y="86" width="220" height="122" rx="16" fill="#f2ebff" stroke="#b6c7d7"/><text x="881" y="135" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#172033">목록·상세 재확인</text><text x="881" y="169" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="16" fill="#334155">일정 한 건과 공유 상태</text></svg>
