<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="255" viewBox="0 0 1120 255" role="img" aria-labelledby="t d"><title id="t">웹페이지의 문장은 자료</title><desc id="d">사용자 목표 → 웹페이지 내용 → 허용 행동만 실행</desc><rect width="1120" height="255" rx="20" fill="#f8fafc"/><text x="45" y="52" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="700" fill="#172033">웹페이지의 문장은 자료</text><rect x="45" y="87" width="325" height="115" rx="16" fill="#e8f3ff" stroke="#b6c7d7"/><text x="63" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">사용자 목표</text><text x="375" y="149" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="398" y="87" width="325" height="115" rx="16" fill="#e8f7ef" stroke="#b6c7d7"/><text x="416" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">웹페이지 내용</text><text x="727" y="149" font-family="sans-serif" font-size="26" fill="#52677d">→</text><rect x="750" y="87" width="325" height="115" rx="16" fill="#fff2de" stroke="#b6c7d7"/><text x="768" y="133" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#172033">허용 행동만 실행</text></svg>
